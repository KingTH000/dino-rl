[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-rl"
version = "0.1.0"
description = "An educational Dino reinforcement learning environment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.0,<2", "torch>=2.2,<3", "PyYAML>=6,<7", "tensorboard>=2.16,<3", "matplotlib>=3.8,<4", "Pillow>=10,<13"]

[project.optional-dependencies]
render = ["pygame>=2.5,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["dino_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
